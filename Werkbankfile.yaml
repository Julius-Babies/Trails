project:
  name: "Trails"
  id: "trails"
  external_domain: "trailsdevelopment.jvbabi.es"

services:
  - name: "api"
    modes:
      local:
        port: 8080

  - name: "frontend"
    modes:
      local:
        port: 5173

http:
  - path_prefixes:
      - /api
    target_service: api
    priority: 100
  - priority: 50
    path_prefixes:
      - /
    target_service: frontend

dependencies:
  androiddns: true
  keycloak: true