project:
  name: "Trails"
  id: "trails"
  external_domain: "trails.julius-babies.wbspace.app"

services:
  - name: "api"
    modes:
      local:
        port: 8080

  - name: "frontend"
    modes:
      local:
        port: 4050

  - name: "Jaeger"
    modes:
      local:
        port: 4318

http:
  - path_prefixes:
      - /api
    target_service: api
  - path_prefixes:
      - /
    target_service: frontend

dependencies:
  androiddns: true
  keycloak: false
